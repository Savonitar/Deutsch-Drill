name: Feature request
description: Suggest an improvement for Deutsch Drill.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea for Deutsch Drill.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add or change?
      description: Describe the feature, content, or behavior you want.
      placeholder: It would help me if ...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Tell me what learning problem this would solve for you.
      placeholder: This would make practice easier because ...
